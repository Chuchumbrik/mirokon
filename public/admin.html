<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mirokon — Админка</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#0F172A;--primary:#1E40AF;--accent:#3B82F6;--muted:#64748B;--border:#E2E8F0;--ice:#EFF6FF;--surface:#fff;
  --sh:0 8px 24px rgba(15,23,42,.08)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;color:var(--ink);background:#f8fafc;min-height:100vh}
.topbar{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
.topbar .row{max-width:1100px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:'Montserrat';font-weight:800;font-size:1.2rem}
.brand b{color:var(--primary)}
.who{color:var(--muted);font-size:.85rem;margin-left:auto;margin-right:12px}
.wrap{max-width:1100px;margin:0 auto;padding:24px 20px 80px}
.tabs{display:flex;gap:8px;margin-bottom:24px;flex-wrap:wrap}
.tab{padding:10px 18px;border:1px solid var(--border);background:#fff;border-radius:12px;font-weight:600;font-size:.95rem;cursor:pointer;color:var(--muted)}
.tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.panel{display:none}.panel.active{display:block}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--sh);padding:22px;margin-bottom:18px}
h2{font-family:'Montserrat';font-weight:700;font-size:1.3rem;margin-bottom:16px}
h3{font-size:1.05rem;font-weight:700;margin-bottom:12px}
label{display:block;font-weight:600;font-size:.85rem;margin:10px 0 5px}
input,textarea,select{width:100%;padding:11px 13px;border:1.5px solid var(--border);border-radius:11px;font-family:'Inter';font-size:.95rem}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(59,130,246,.15)}
textarea{resize:vertical;min-height:70px}
.check{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:.9rem;font-weight:500}
.scope-checks{display:grid;grid-template-columns:1fr 1fr;gap:2px 18px;margin-top:6px}
.scope-checks .check{margin-top:6px}
@media(max-width:560px){.scope-checks{grid-template-columns:1fr}}
.check input{width:auto}
.btn{display:inline-flex;align-items:center;gap:6px;border:none;cursor:pointer;font-family:'Inter';font-weight:600;font-size:.88rem;padding:9px 15px;border-radius:10px;transition:.15s}
.btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{background:#1D4ED8}
.btn-ghost{background:#f1f5f9;color:var(--ink)}.btn-ghost:hover{background:#e2e8f0}
.btn-danger{background:#fef2f2;color:#b91c1c}.btn-danger:hover{background:#fee2e2}
.btn-ok{background:#ecfdf5;color:#047857}.btn-ok:hover{background:#d1fae5}
.btn:disabled{opacity:.5;cursor:default}
.list-item{display:flex;gap:14px;align-items:flex-start;padding:14px;border:1px solid var(--border);border-radius:13px;margin-bottom:10px;background:#fff}
.thumb{width:70px;height:54px;border-radius:9px;object-fit:cover;flex:none;background:linear-gradient(135deg,#dbeafe,#eff6ff);display:flex;align-items:center;justify-content:center;color:var(--accent);font-size:1.4rem}
.li-body{flex:1;min-width:0}
.li-body .t{font-weight:600}
.li-body .m{color:var(--muted);font-size:.85rem;margin-top:2px;overflow:hidden;text-overflow:ellipsis}
.li-actions{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.badge{font-size:.72rem;font-weight:600;padding:3px 9px;border-radius:99px}
.badge.on{background:#ecfdf5;color:#047857}.badge.off{background:#fef3c7;color:#92400e}
.stars{color:#fbbf24;letter-spacing:1px}
.filters{display:flex;gap:8px;margin-bottom:14px}
.filters .f{padding:7px 13px;border:1px solid var(--border);border-radius:10px;background:#fff;font-size:.85rem;cursor:pointer;color:var(--muted)}
.filters .f.active{background:var(--ink);color:#fff;border-color:var(--ink)}
.empty{text-align:center;color:var(--muted);padding:30px;border:1px dashed var(--border);border-radius:13px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:12px;box-shadow:var(--sh);font-size:.9rem;opacity:0;transition:.3s;pointer-events:none}
.toast.show{opacity:1}
.toast.err{background:#b91c1c}
.row2{display:grid;grid-template-columns:1fr 140px;gap:12px}
@media(max-width:560px){.row2{grid-template-columns:1fr}}
.ph-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:10px 0}
.ph-card{position:relative;border-radius:10px;overflow:hidden;aspect-ratio:4/3;background:#f1f5f9;border:1px solid var(--border);cursor:pointer}
.ph-card img{width:100%;height:100%;object-fit:cover;display:block;transition:.15s}
.ph-card:hover img{opacity:.82}
.ph-ov{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:6px;opacity:0;transition:.15s;background:linear-gradient(to bottom,rgba(0,0,0,.35) 0,transparent 45%,transparent 55%,rgba(0,0,0,.45) 100%)}
.ph-card:hover .ph-ov{opacity:1}
.ph-row{display:flex;gap:4px}
.ph-b{background:rgba(255,255,255,.88);border:none;border-radius:7px;cursor:pointer;padding:4px 8px;font-size:.75rem;font-weight:700;color:var(--ink);line-height:1.4}
.ph-b:hover{background:#fff}
.ph-b.rm{color:#b91c1c}
.ph-add-zone{border:2px dashed var(--border);border-radius:10px;padding:18px;text-align:center;cursor:pointer;color:var(--muted);font-size:.88rem;margin-top:6px;transition:.15s}
.ph-add-zone:hover{border-color:var(--accent);color:var(--accent);background:var(--ice)}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.93);z-index:200;display:none;align-items:center;justify-content:center;flex-direction:column}
.lb.open{display:flex}
.lb img{max-width:90vw;max-height:82vh;border-radius:8px;object-fit:contain;display:block}
.lb-x{position:absolute;top:14px;right:18px;color:#fff;font-size:2rem;cursor:pointer;background:none;border:none;line-height:1;opacity:.8}
.lb-x:hover{opacity:1}
.lb-arr{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.14);color:#fff;border:none;border-radius:50%;width:46px;height:46px;font-size:1.5rem;cursor:pointer;display:flex;align-items:center;justify-content:center}
.lb-arr:hover{background:rgba(255,255,255,.25)}
.lb-arr.p{left:14px}.lb-arr.n{right:14px}
.lb-cnt{color:rgba(255,255,255,.6);font-size:.82rem;margin-top:10px}
.ph-cover-badge{position:absolute;bottom:6px;left:6px;background:rgba(30,64,175,.85);color:#fff;font-size:.7rem;font-weight:700;padding:2px 7px;border-radius:5px;pointer-events:none;letter-spacing:.3px}
.lead-card{background:#fff;border:1px solid var(--border);border-radius:13px;margin-bottom:10px}
.lead-card-head{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border)}
.lead-card-name{font-weight:700;font-size:1rem;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lead-card-acts{display:flex;gap:6px;flex-shrink:0;align-items:center;flex-wrap:wrap}
.lead-card-body{padding:12px 16px}
.lead-card-phone{display:block;color:var(--primary);font-weight:600;font-size:.95rem;text-decoration:none;margin-bottom:4px}
.lead-card-phone:hover{text-decoration:underline}
.lead-card-msg{font-size:.84rem;color:var(--muted);margin-bottom:6px}
.lead-card-when{font-size:.76rem;color:var(--muted);margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}
.lead-cart{margin-top:10px;border-top:1px solid var(--border);padding-top:10px}
.lead-cart-row{margin-bottom:6px;font-size:.84rem}
.lcr-main{display:flex;gap:5px;align-items:baseline}
.lcr-idx{color:var(--muted);flex-shrink:0;min-width:16px}
.lcr-name{flex:1;color:var(--ink);font-weight:500}
.lcr-price{color:var(--ink);font-weight:700;white-space:nowrap}
.lcr-size{color:var(--muted);font-size:.78rem;padding-left:14px;margin-top:2px}
.lead-cart-total{display:flex;justify-content:space-between;align-items:center;margin-top:8px;padding-top:8px;border-top:1px solid var(--border);font-size:.85rem}
.lct-lbl{color:var(--muted)}
.lct-sum{font-weight:800;color:var(--primary);font-size:.95rem}
@media(hover:none){.ph-ov{opacity:1}}
.lb-single .lb-arr,.lb-single .lb-cnt{display:none}
</style>
</head>
<body>
  <div class="topbar"><div class="row">
    <div class="brand">MIRO<b>KON</b> · админка</div>
    <span class="who" id="admin-email"></span>
    <button class="btn btn-ghost" onclick="logout()">Выйти</button>
  </div></div>

  <div class="wrap">
    <div class="tabs">
      <button class="tab active" data-tab="leads" onclick="switchTab('leads')">Заявки</button>
      <button class="tab" data-tab="works" onclick="switchTab('works')">Работы</button>
      <button class="tab" data-tab="reviews" onclick="switchTab('reviews')">Отзывы</button>
      <button class="tab" data-tab="news" onclick="switchTab('news')">Новости</button>
    </div>

    <!-- LEADS -->
    <section class="panel active" id="panel-leads">
      <h2>Заявки</h2>
      <div class="filters">
        <div class="f active" data-lf="new" onclick="setLeadFilter('new')">Новые</div>
        <div class="f" data-lf="processed" onclick="setLeadFilter('processed')">Обработанные</div>
        <div class="f" data-lf="all" onclick="setLeadFilter('all')">Все</div>
      </div>
      <div id="leads-list"></div>
    </section>

    <!-- WORKS -->
    <section class="panel" id="panel-works">
      <div class="card">
        <h3 id="works-form-title">Добавить работу</h3>
        <input type="hidden" id="w-id">
        <div class="row2">
          <div><label>Название *</label><input id="w-title" placeholder="Гостиная на Ленина"></div>
          <div><label>Категория</label><input id="w-category" placeholder="Гостиная"></div>
        </div>
        <label>Описание</label><textarea id="w-desc" placeholder="Двухкамерный стеклопакет…"></textarea>
        <div><label>Порядок</label><input type="number" id="w-sort" value="0" style="max-width:140px"></div>
        <div class="row2" style="margin-top:8px">
          <div><label>Система (профиль)</label><input id="w-system" placeholder="VEKA Softline 70"></div>
          <div><label>Цена «от», ₽</label><input type="number" id="w-pricefrom" placeholder="38000"></div>
        </div>
        <div class="row2">
          <div><label>Срок, дней</label><input type="number" id="w-duration" placeholder="1"></div>
          <div><label>Район / город</label><input id="w-area" placeholder="Химки"></div>
        </div>
        <div class="row2">
          <div><label>Гарантия</label><input id="w-warranty" placeholder="5 лет"></div>
          <div><label>Тип окна (для «Рассчитать»)</label>
            <select id="w-tpltype">
              <option value="">— не задан —</option>
              <option value="single-turn">Одностворчатое поворотное</option>
              <option value="single-deaf">Одностворчатое глухое</option>
              <option value="double-deaf-turn">Двустворчатое (глухое + поворотное)</option>
              <option value="double-turn">Двустворчатое поворотное</option>
              <option value="triple">Трёхстворчатое</option>
              <option value="balcony">Балконный блок</option>
            </select>
          </div>
        </div>
        <label style="margin-top:10px">Перечень работ (под ключ)</label>
        <div class="scope-checks" id="w-scope">
          <label class="check"><input type="checkbox" value="Демонтаж старого"> Демонтаж старого</label>
          <label class="check"><input type="checkbox" value="Монтаж окна"> Монтаж окна</label>
          <label class="check"><input type="checkbox" value="Откосы и подоконник"> Откосы и подоконник</label>
          <label class="check"><input type="checkbox" value="Вынос мусора и уборка"> Вынос мусора и уборка</label>
        </div>
        <div id="w-newphoto-wrap" style="margin-top:12px">
          <label>Фото (обложка)</label>
          <input type="file" id="w-photo" accept="image/*">
        </div>
        <div id="w-photos-section" style="display:none;margin-top:14px">
          <label style="margin-bottom:8px">Фото галереи</label>
          <div class="ph-grid" id="w-photo-grid"></div>
          <div class="ph-add-zone" id="w-add-zone" onclick="$('w-multi-input').click()">+ Добавить фото</div>
          <input type="file" id="w-multi-input" accept="image/*" multiple style="display:none" onchange="addWorkPhotos(this.files)">
        </div>
        <label class="check"><input type="checkbox" id="w-published"> Опубликовать на сайте</label>
        <div style="margin-top:16px;display:flex;gap:8px">
          <button class="btn btn-primary" id="w-save" onclick="saveWork()">Сохранить</button>
          <button class="btn btn-ghost" onclick="resetWorkForm()">Очистить</button>
        </div>
      </div>
      <h2>Работы</h2>
      <div id="works-list"></div>
    </section>

    <!-- REVIEWS -->
    <section class="panel" id="panel-reviews">
      <h2>Отзывы</h2>
      <div class="filters">
        <div class="f active" data-rf="pending" onclick="setReviewFilter('pending')">На модерации</div>
        <div class="f" data-rf="approved" onclick="setReviewFilter('approved')">Опубликованные</div>
        <div class="f" data-rf="all" onclick="setReviewFilter('all')">Все</div>
      </div>
      <div id="reviews-list"></div>
    </section>

    <!-- NEWS -->
    <section class="panel" id="panel-news">
      <div class="card">
        <h3 id="news-form-title">Добавить новость</h3>
        <input type="hidden" id="n-id">
        <label>Заголовок *</label><input id="n-title" placeholder="Гарантия 5 лет">
        <label>Краткий текст (в карточке)</label><textarea id="n-preview" placeholder="Коротко…"></textarea>
        <label>Полный текст (опционально)</label><textarea id="n-body"></textarea>
        <label class="check"><input type="checkbox" id="n-published"> Опубликовать</label>
        <div style="margin-top:16px;display:flex;gap:8px">
          <button class="btn btn-primary" id="n-save" onclick="saveNews()">Сохранить</button>
          <button class="btn btn-ghost" onclick="resetNewsForm()">Очистить</button>
        </div>
      </div>
      <h2>Новости</h2>
      <div id="news-list"></div>
    </section>
  </div>

  <div class="toast" id="toast"></div>

  <div class="lb" id="lightbox" onclick="lbBgClick(event)">
    <button class="lb-x" onclick="closeLb()">&times;</button>
    <button class="lb-arr p" onclick="lbNav(-1);event.stopPropagation()">&#8249;</button>
    <img id="lb-img" src="" alt="">
    <button class="lb-arr n" onclick="lbNav(1);event.stopPropagation()">&#8250;</button>
    <span class="lb-cnt" id="lb-cnt"></span>
  </div>

<script>
  const SUPABASE_URL = 'https://ermeokjqkzpkefqtmvif.supabase.co';
  const SUPABASE_ANON = 'sb_publishable_LhXYeGG0w8wzi7JOlPx5Qg_GXd2Zc0K';
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
  const $ = id => document.getElementById(id);
  const safeUrl = u => (u && /^(https?:\/\/|\/)/i.test(u)) ? u : '';

  function toast(msg, isErr) {
    const t = $('toast'); t.textContent = msg; t.className = 'toast show' + (isErr ? ' err' : '');
    setTimeout(() => { t.className = 'toast'; }, 2600);
  }
  // безопасный конструктор элементов (текст через textContent)
  function el(tag, opts, ...kids) {
    const e = document.createElement(tag); opts = opts || {};
    if (opts.class) e.className = opts.class;
    if (opts.text != null) e.textContent = opts.text;
    if (opts.html === 'svg-win') e.innerHTML = '🪟';
    Object.entries(opts).forEach(([k, v]) => { if (['class','text','html'].includes(k)) return; if (k.startsWith('on')) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v); });
    kids.forEach(k => k && e.appendChild(k));
    return e;
  }

  // ---- Auth guard ----
  (async () => {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) return location.replace('/landing.html');
    const { data: admin, error } = await sb.rpc('is_admin');
    if (error || !admin) { await sb.auth.signOut(); alert('Нет прав администратора'); return location.replace('/landing.html'); }
    $('admin-email').textContent = session.user.email;
    loadLeads(); loadWorks(); loadReviews(); loadNews();
  })();

  async function logout() { await sb.auth.signOut(); location.replace('/landing.html'); }

  function switchTab(name) {
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === name));
    document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.id === 'panel-' + name));
  }

  // ================= LEADS (заявки) =================
  let leadFilter = 'new';
  function setLeadFilter(f) {
    leadFilter = f;
    document.querySelectorAll('.filters .f[data-lf]').forEach(x => x.classList.toggle('active', x.dataset.lf === f));
    loadLeads();
  }
  async function loadLeads() {
    const box = $('leads-list'); box.replaceChildren();
    let q = sb.from('leads').select('*').order('created_at', { ascending: false });
    if (leadFilter === 'new') q = q.eq('processed', false);
    else if (leadFilter === 'processed') q = q.eq('processed', true);
    const { data, error } = await q;
    if (error) return toast('Ошибка загрузки заявок', true);
    if (!data.length) { box.appendChild(el('div', { class: 'empty', text: 'Нет заявок в этой категории' })); return; }
    data.forEach(l => {
      const badge = el('span', { class: 'badge ' + (l.processed ? 'on' : 'off'), text: l.processed ? 'обработана' : 'новая' });
      const head = el('div', { class: 'lead-card-head' },
        el('div', { class: 'lead-card-name', text: l.name || '—' }),
        el('div', { class: 'lead-card-acts' },
          badge,
          el('button', { class: l.processed ? 'btn btn-ghost' : 'btn btn-ok', text: l.processed ? 'Вернуть' : 'Обработана',
            onclick: () => moderateLead(l.id, l.processed ? 'unprocess' : 'process') }),
          el('button', { class: 'btn btn-danger', text: 'Удалить', onclick: () => moderateLead(l.id, 'delete') })
        )
      );
      const body = el('div', { class: 'lead-card-body' },
        el('a', { class: 'lead-card-phone', href: 'tel:' + (l.phone || '').replace(/[^\d+]/g, ''), text: l.phone || '—' })
      );
      if (l.message) body.appendChild(el('div', { class: 'lead-card-msg', text: l.message }));
      if (l.cart_items && l.cart_items.length) {
        const cartDiv = el('div', { class: 'lead-cart' });
        let total = 0;
        l.cart_items.forEach((item, i) => {
          total += item.price || 0;
          const row = el('div', { class: 'lead-cart-row' });
          row.appendChild(el('div', { class: 'lcr-main' },
            el('span', { class: 'lcr-idx', text: (i + 1) + '.' }),
            el('span', { class: 'lcr-name', text: item.type }),
            el('span', { class: 'lcr-price', text: '~' + (item.price || 0).toLocaleString('ru-RU') + ' ₽' })
          ));
          const specs = [item.profile, item.glass, item.hardware].filter(Boolean).join(' · ');
          row.appendChild(el('div', { class: 'lcr-size', text: item.width + '×' + item.height + ' мм' + (specs ? '  ·  ' + specs : '') }));
          cartDiv.appendChild(row);
        });
        const n = l.cart_items.length, word = n === 1 ? 'позицию' : n <= 4 ? 'позиции' : 'позиций';
        cartDiv.appendChild(el('div', { class: 'lead-cart-total' },
          el('span', { class: 'lct-lbl', text: 'Итого за ' + n + ' ' + word }),
          el('span', { class: 'lct-sum', text: '~' + total.toLocaleString('ru-RU') + ' ₽' })
        ));
        body.appendChild(cartDiv);
      }
      body.appendChild(el('div', { class: 'lead-card-when', text: new Date(l.created_at).toLocaleString('ru-RU') }));
      box.appendChild(el('div', { class: 'lead-card' }, head, body));
    });
  }
  async function moderateLead(id, action) {
    if (action === 'delete' && !confirm('Удалить заявку безвозвратно?')) return;
    try {
      const { data: { session } } = await sb.auth.getSession();
      if (!session) return location.replace('/landing.html');
      const res = await fetch('/api/moderate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + session.access_token },
        body: JSON.stringify({ type: 'lead', id, action })
      });
      const d = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(d.error || ('код ' + res.status));
      toast(action === 'delete' ? 'Удалено' : action === 'process' ? 'Обработана' : 'Возвращено в работу');
      loadLeads();
    } catch (e) {
      toast('Ошибка: ' + (e.message || e), true);
    }
  }

  // ================= WORKS =================
  async function loadWorks() {
    const box = $('works-list'); box.replaceChildren();
    const { data, error } = await sb.from('works').select('*, work_photos(id)').order('sort').order('created_at', { ascending: false });
    if (error) return toast('Ошибка загрузки работ', true);
    if (!data.length) { box.appendChild(el('div', { class: 'empty', text: 'Пока нет работ' })); return; }
    data.forEach(w => {
      const img = safeUrl(w.image_url);
      const thumb = img ? el('img', { class: 'thumb', src: img, alt: '' }) : el('div', { class: 'thumb', text: '🪟' });
      const badge = el('span', { class: 'badge ' + (w.published ? 'on' : 'off'), text: w.published ? 'на сайте' : 'черновик' });
      const photoCount = w.work_photos?.length || 0;
      const meta = [w.category, w.description].filter(Boolean).join(' · ');
      const actions = el('div', { class: 'li-actions' },
        badge,
        el('button', { class: 'btn btn-ghost', text: w.published ? 'Снять' : 'Опубликовать', onclick: () => togglePublish('works', w.id, !w.published) }),
        el('button', { class: 'btn btn-ghost', text: 'Изменить', onclick: () => editWork(w) }),
        el('button', { class: 'btn btn-danger', text: 'Удалить', onclick: () => del('works', w.id) })
      );
      box.appendChild(el('div', { class: 'list-item' }, thumb,
        el('div', { class: 'li-body' },
          el('div', { class: 't', text: w.title }),
          el('div', { class: 'm', text: [meta, photoCount ? photoCount + ' фото' : ''].filter(Boolean).join(' · ') })),
        actions));
    });
  }
  function editWork(w) {
    $('w-id').value = w.id; $('w-title').value = w.title || ''; $('w-category').value = w.category || '';
    $('w-desc').value = w.description || ''; $('w-sort').value = w.sort || 0; $('w-published').checked = !!w.published;
    $('w-system').value = w.system || ''; $('w-pricefrom').value = w.price_from || ''; $('w-duration').value = w.duration_days || '';
    $('w-area').value = w.area || ''; $('w-warranty').value = w.warranty || ''; $('w-tpltype').value = w.tpl_window_type || '';
    const scopeSet = new Set(w.scope || []);
    $('w-scope').querySelectorAll('input[type=checkbox]').forEach(cb => cb.checked = scopeSet.has(cb.value));
    $('works-form-title').textContent = 'Изменить работу';
    $('w-newphoto-wrap').style.display = 'none';
    $('w-photos-section').style.display = 'block';
    loadWorkPhotos(w.id);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
  function resetWorkForm() {
    ['w-id','w-title','w-category','w-desc','w-photo','w-system','w-pricefrom','w-duration','w-area','w-warranty'].forEach(i => $(i).value = '');
    $('w-tpltype').value = '';
    $('w-scope').querySelectorAll('input[type=checkbox]').forEach(cb => cb.checked = false);
    $('w-sort').value = 0; $('w-published').checked = false; $('works-form-title').textContent = 'Добавить работу';
    $('w-newphoto-wrap').style.display = 'block';
    $('w-photos-section').style.display = 'none';
    wpCache = []; $('w-photo-grid').replaceChildren();
    const z = $('w-add-zone'); if (z) { z.textContent = '+ Добавить фото'; z.style.pointerEvents = ''; }
  }
  async function saveWork() {
    const title = $('w-title').value.trim();
    if (!title) return toast('Укажите название', true);
    const btn = $('w-save'); btn.disabled = true; btn.textContent = 'Сохранение…';
    try {
      const id = $('w-id').value;
      let image_url = null, coverPath = null;
      if (!id) {
        const file = $('w-photo').files[0];
        if (file) {
          if (file.size > 15 * 1024 * 1024) throw new Error('Файл больше 15 МБ');
          const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
          coverPath = `${crypto.randomUUID()}.${ext}`;
          const up = await sb.storage.from('works').upload(coverPath, file, { cacheControl: '3600', upsert: false });
          if (up.error) throw up.error;
          image_url = sb.storage.from('works').getPublicUrl(coverPath).data.publicUrl;
        }
      }
      const scope = [...$('w-scope').querySelectorAll('input[type=checkbox]:checked')].map(cb => cb.value);
      const row = { title, category: $('w-category').value.trim() || null, description: $('w-desc').value.trim() || null,
        sort: parseInt($('w-sort').value, 10) || 0, published: $('w-published').checked,
        system: $('w-system').value.trim() || null,
        price_from: parseInt($('w-pricefrom').value, 10) || null,
        duration_days: parseInt($('w-duration').value, 10) || null,
        area: $('w-area').value.trim() || null,
        warranty: $('w-warranty').value.trim() || null,
        tpl_window_type: $('w-tpltype').value || null,
        scope: scope.length ? scope : null };
      if (image_url) row.image_url = image_url;
      if (id) {
        const res = await sb.from('works').update(row).eq('id', id);
        if (res.error) throw res.error;
        toast('Сохранено'); loadWorks();
      } else {
        const res = await sb.from('works').insert(row).select('id').single();
        if (res.error) throw res.error;
        const newId = res.data.id;
        if (image_url) {
          const ins = await sb.from('work_photos').insert({ work_id: newId, url: image_url, storage_path: coverPath, sort: 0 });
          if (ins.error) toast('Фото сохранено, но не добавлено в галерею: ' + ins.error.message, true);
        }
        $('w-id').value = newId;
        $('works-form-title').textContent = 'Изменить работу';
        $('w-newphoto-wrap').style.display = 'none';
        $('w-photos-section').style.display = 'block';
        $('w-photo').value = '';
        await loadWorkPhotos(newId);
        toast('Сохранено — теперь можно добавить больше фото'); loadWorks();
      }
    } catch (e) { toast('Ошибка: ' + (e.message || e), true); }
    finally { btn.disabled = false; btn.textContent = 'Сохранить'; }
  }

  // ================= PHOTO GALLERY =================
  let wpCache = [], lbPhotos = [], lbIdx = 0, wpMoving = false;

  async function loadWorkPhotos(workId) {
    const { data, error } = await sb.from('work_photos').select('*').eq('work_id', workId).order('sort').order('created_at');
    if (error) { toast('Ошибка загрузки фото', true); return; }
    wpCache = data || [];
    renderWpGrid();
  }

  function renderWpGrid() {
    const grid = $('w-photo-grid'); grid.replaceChildren();
    wpCache.forEach((ph, i) => {
      const card = document.createElement('div'); card.className = 'ph-card';
      const img = el('img', { src: safeUrl(ph.url), alt: '' });
      img.addEventListener('click', () => openLb(i));
      const ov = el('div', { class: 'ph-ov' });
      const topRow = el('div', { class: 'ph-row' });
      if (i > 0) topRow.appendChild(el('button', { class: 'ph-b', text: '↑', title: 'Выше', onclick: (e) => { e.stopPropagation(); moveWp(ph.id, -1); } }));
      if (i < wpCache.length - 1) topRow.appendChild(el('button', { class: 'ph-b', text: '↓', title: 'Ниже', onclick: (e) => { e.stopPropagation(); moveWp(ph.id, 1); } }));
      const botRow = el('div', { class: 'ph-row' },
        el('button', { class: 'ph-b rm', text: '✕ Удалить', onclick: (e) => { e.stopPropagation(); delWp(ph.id, ph.storage_path); } })
      );
      ov.appendChild(topRow); ov.appendChild(botRow);
      card.appendChild(img); card.appendChild(ov);
      if (i === 0) card.appendChild(el('div', { class: 'ph-cover-badge', text: 'Обложка' }));
      grid.appendChild(card);
    });
  }

  async function addWorkPhotos(files) {
    if (!files.length) return;
    const workId = $('w-id').value;
    if (!workId) { toast('Сначала сохраните работу', true); return; }
    const MAX = 15 * 1024 * 1024;
    for (const f of files) {
      if (f.size > MAX) return toast(`"${f.name}" больше 15 МБ`, true);
    }
    const zone = $('w-add-zone');
    const wasEmpty = wpCache.length === 0;
    let nextSort = wpCache.length ? Math.max(...wpCache.map(p => p.sort)) + 1 : 0;
    let done = 0;
    zone.textContent = `Загрузка 0 / ${files.length}…`;
    zone.style.pointerEvents = 'none';
    for (let i = 0; i < files.length; i++) {
      try {
        const ext = (files[i].name.split('.').pop() || 'jpg').toLowerCase();
        const storagePath = `${crypto.randomUUID()}.${ext}`;
        const up = await sb.storage.from('works').upload(storagePath, files[i], { cacheControl: '3600', upsert: false });
        if (up.error) throw up.error;
        const url = sb.storage.from('works').getPublicUrl(storagePath).data.publicUrl;
        const ins = await sb.from('work_photos').insert({ work_id: workId, url, storage_path: storagePath, sort: nextSort++ });
        if (ins.error) { await sb.storage.from('works').remove([storagePath]); throw ins.error; }
        done++;
        zone.textContent = `Загрузка ${done} / ${files.length}…`;
      } catch (e) { toast('Ошибка: ' + (e.message || e), true); }
    }
    zone.textContent = '+ Добавить фото';
    zone.style.pointerEvents = '';
    $('w-multi-input').value = '';
    await loadWorkPhotos(workId);
    if (wasEmpty && wpCache.length > 0) await sb.from('works').update({ image_url: wpCache[0].url }).eq('id', workId);
    if (done > 0) toast(done > 1 ? `Добавлено ${done} фото` : 'Фото добавлено');
    loadWorks();
  }

  async function delWp(photoId, storagePath) {
    if (!confirm('Удалить фото?')) return;
    const { error } = await sb.from('work_photos').delete().eq('id', photoId);
    if (error) return toast('Ошибка удаления', true);
    if (storagePath) await sb.storage.from('works').remove([storagePath]);
    wpCache = wpCache.filter(p => p.id !== photoId);
    const workId = $('w-id').value;
    const cover = wpCache.length ? wpCache[0].url : null;
    await sb.from('works').update({ image_url: cover }).eq('id', workId);
    renderWpGrid(); loadWorks(); toast('Удалено');
  }

  async function moveWp(photoId, dir) {
    if (wpMoving) return;
    wpMoving = true;
    try {
      const idx = wpCache.findIndex(p => p.id === photoId);
      const swap = idx + dir;
      if (swap < 0 || swap >= wpCache.length) return;
      [wpCache[idx], wpCache[swap]] = [wpCache[swap], wpCache[idx]];
      const results = await Promise.all(wpCache.map((p, i) => sb.from('work_photos').update({ sort: i }).eq('id', p.id)));
      if (results.some(r => r.error)) {
        toast('Ошибка сортировки', true);
        await loadWorkPhotos($('w-id').value);
        return;
      }
      wpCache.forEach((p, i) => p.sort = i);
      const workId = $('w-id').value;
      if (idx === 0 || swap === 0) await sb.from('works').update({ image_url: wpCache[0].url }).eq('id', workId);
      renderWpGrid(); loadWorks();
    } finally { wpMoving = false; }
  }

  function openLb(idx) {
    lbPhotos = wpCache; lbIdx = idx;
    $('lb-img').src = safeUrl(lbPhotos[idx].url);
    $('lb-cnt').textContent = (idx + 1) + ' / ' + lbPhotos.length;
    $('lightbox').classList.toggle('lb-single', lbPhotos.length === 1);
    $('lightbox').classList.add('open');
    document.addEventListener('keydown', lbKey);
  }
  function closeLb() {
    $('lightbox').classList.remove('open');
    document.removeEventListener('keydown', lbKey);
  }
  function lbBgClick(e) { if (e.target === $('lightbox')) closeLb(); }
  function lbNav(dir) {
    lbIdx = (lbIdx + dir + lbPhotos.length) % lbPhotos.length;
    $('lb-img').src = safeUrl(lbPhotos[lbIdx].url);
    $('lb-cnt').textContent = (lbIdx + 1) + ' / ' + lbPhotos.length;
  }
  function lbKey(e) {
    if (e.key === 'ArrowLeft') lbNav(-1);
    else if (e.key === 'ArrowRight') lbNav(1);
    else if (e.key === 'Escape') closeLb();
  }

  // ================= REVIEWS =================
  let reviewFilter = 'pending';
  function setReviewFilter(f) {
    reviewFilter = f;
    document.querySelectorAll('.filters .f[data-rf]').forEach(x => x.classList.toggle('active', x.dataset.rf === f));
    loadReviews();
  }
  async function loadReviews() {
    const box = $('reviews-list'); box.replaceChildren();
    let q = sb.from('reviews').select('*').order('created_at', { ascending: false });
    if (reviewFilter === 'pending') q = q.eq('approved', false);
    else if (reviewFilter === 'approved') q = q.eq('approved', true);
    const { data, error } = await q;
    if (error) return toast('Ошибка загрузки отзывов', true);
    if (!data.length) { box.appendChild(el('div', { class: 'empty', text: 'Нет отзывов в этой категории' })); return; }
    data.forEach(r => {
      const badge = el('span', { class: 'badge ' + (r.approved ? 'on' : 'off'), text: r.approved ? 'опубликован' : 'на модерации' });
      const actions = el('div', { class: 'li-actions' }, badge,
        el('button', { class: r.approved ? 'btn btn-ghost' : 'btn btn-ok', text: r.approved ? 'Снять' : 'Одобрить',
          onclick: () => r.approved ? togglePublish('reviews', r.id, false, 'approved') : moderateReview(r.id, 'approve') }),
        el('button', { class: 'btn btn-danger', text: 'Удалить', onclick: () => moderateReview(r.id, 'reject') })
      );
      box.appendChild(el('div', { class: 'list-item' },
        el('div', { class: 'li-body' },
          el('div', { class: 't' }, el('span', { class: 'stars', text: '★'.repeat(r.rating) }), document.createTextNode('  ' + (r.author_name || '') + (r.author_city ? ' · ' + r.author_city : ''))),
          el('div', { class: 'm', text: r.text })),
        actions));
    });
  }

  // ================= NEWS =================
  async function loadNews() {
    const box = $('news-list'); box.replaceChildren();
    const { data, error } = await sb.from('news').select('*').order('created_at', { ascending: false });
    if (error) return toast('Ошибка загрузки новостей', true);
    if (!data.length) { box.appendChild(el('div', { class: 'empty', text: 'Пока нет новостей' })); return; }
    data.forEach(n => {
      const badge = el('span', { class: 'badge ' + (n.published ? 'on' : 'off'), text: n.published ? 'на сайте' : 'черновик' });
      const actions = el('div', { class: 'li-actions' }, badge,
        el('button', { class: 'btn btn-ghost', text: n.published ? 'Снять' : 'Опубликовать', onclick: () => togglePublish('news', n.id, !n.published) }),
        el('button', { class: 'btn btn-ghost', text: 'Изменить', onclick: () => editNews(n) }),
        el('button', { class: 'btn btn-danger', text: 'Удалить', onclick: () => del('news', n.id) })
      );
      box.appendChild(el('div', { class: 'list-item' },
        el('div', { class: 'li-body' }, el('div', { class: 't', text: n.title }), el('div', { class: 'm', text: n.preview_text || '' })),
        actions));
    });
  }
  function editNews(n) {
    $('n-id').value = n.id; $('n-title').value = n.title || ''; $('n-preview').value = n.preview_text || '';
    $('n-body').value = n.body || ''; $('n-published').checked = !!n.published;
    $('news-form-title').textContent = 'Изменить новость'; window.scrollTo({ top: 0, behavior: 'smooth' });
  }
  function resetNewsForm() {
    ['n-id','n-title','n-preview','n-body'].forEach(i => $(i).value = '');
    $('n-published').checked = false; $('news-form-title').textContent = 'Добавить новость';
  }
  async function saveNews() {
    const title = $('n-title').value.trim();
    if (!title) return toast('Укажите заголовок', true);
    const btn = $('n-save'); btn.disabled = true; btn.textContent = 'Сохранение…';
    try {
      const row = { title, preview_text: $('n-preview').value.trim() || null, body: $('n-body').value.trim() || null, published: $('n-published').checked };
      const id = $('n-id').value;
      const res = id ? await sb.from('news').update(row).eq('id', id) : await sb.from('news').insert(row);
      if (res.error) throw res.error;
      toast('Сохранено'); resetNewsForm(); loadNews();
    } catch (e) { toast('Ошибка: ' + (e.message || e), true); }
    finally { btn.disabled = false; btn.textContent = 'Сохранить'; }
  }

  // ================= общие =================
  async function togglePublish(table, id, value, field) {
    const f = field || 'published';
    const { error } = await sb.from(table).update({ [f]: value }).eq('id', id);
    if (error) return toast('Ошибка: ' + error.message, true);
    toast(value ? 'Опубликовано' : 'Снято с публикации');
    table === 'works' ? loadWorks() : table === 'reviews' ? loadReviews() : loadNews();
  }
  async function del(table, id) {
    if (!confirm('Удалить запись безвозвратно?')) return;
    if (table === 'works') {
      const { data: photos } = await sb.from('work_photos').select('storage_path').eq('work_id', id);
      if (photos && photos.length) {
        const paths = photos.map(p => p.storage_path).filter(Boolean);
        if (paths.length) await sb.storage.from('works').remove(paths);
      }
      if ($('w-id').value === id) resetWorkForm();
    }
    const { error } = await sb.from(table).delete().eq('id', id);
    if (error) return toast('Ошибка: ' + error.message, true);
    toast('Удалено');
    table === 'works' ? loadWorks() : table === 'reviews' ? loadReviews() : loadNews();
  }

  // Модерация отзыва через сервер: меняет БД И редактирует сообщение в Telegram
  // (убирает кнопки, дописывает «обработано в админке»).
  async function moderateReview(id, action) {
    if (action === 'reject' && !confirm('Удалить отзыв безвозвратно?')) return;
    try {
      const { data: { session } } = await sb.auth.getSession();
      if (!session) return location.replace('/landing.html');
      const res = await fetch('/api/moderate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + session.access_token },
        body: JSON.stringify({ id, action })
      });
      const d = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(d.error || ('код ' + res.status));
      toast(action === 'approve' ? 'Одобрено' : 'Удалено');
      loadReviews();
    } catch (e) {
      toast('Ошибка: ' + (e.message || e), true);
    }
  }
</script>
</body>
</html>
