<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mirokon — Админка</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#0F172A;--primary:#1E40AF;--accent:#3B82F6;--muted:#64748B;--border:#E2E8F0;--ice:#EFF6FF;--surface:#fff;
  --sh:0 8px 24px rgba(15,23,42,.08)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;color:var(--ink);background:#f8fafc;min-height:100vh}
.topbar{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
.topbar .row{max-width:1100px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:'Montserrat';font-weight:800;font-size:1.2rem}
.brand b{color:var(--primary)}
.who{color:var(--muted);font-size:.85rem;margin-left:auto;margin-right:12px}
.wrap{max-width:1100px;margin:0 auto;padding:24px 20px 80px}
.tabs{display:flex;gap:8px;margin-bottom:24px;flex-wrap:wrap}
.tab{padding:10px 18px;border:1px solid var(--border);background:#fff;border-radius:12px;font-weight:600;font-size:.95rem;cursor:pointer;color:var(--muted)}
.tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.panel{display:none}.panel.active{display:block}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--sh);padding:22px;margin-bottom:18px}
h2{font-family:'Montserrat';font-weight:700;font-size:1.3rem;margin-bottom:16px}
h3{font-size:1.05rem;font-weight:700;margin-bottom:12px}
label{display:block;font-weight:600;font-size:.85rem;margin:10px 0 5px}
input,textarea,select{width:100%;padding:11px 13px;border:1.5px solid var(--border);border-radius:11px;font-family:'Inter';font-size:.95rem}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(59,130,246,.15)}
textarea{resize:vertical;min-height:70px}
.check{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:.9rem;font-weight:500}
.check input{width:auto}
.btn{display:inline-flex;align-items:center;gap:6px;border:none;cursor:pointer;font-family:'Inter';font-weight:600;font-size:.88rem;padding:9px 15px;border-radius:10px;transition:.15s}
.btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{background:#1D4ED8}
.btn-ghost{background:#f1f5f9;color:var(--ink)}.btn-ghost:hover{background:#e2e8f0}
.btn-danger{background:#fef2f2;color:#b91c1c}.btn-danger:hover{background:#fee2e2}
.btn-ok{background:#ecfdf5;color:#047857}.btn-ok:hover{background:#d1fae5}
.btn:disabled{opacity:.5;cursor:default}
.list-item{display:flex;gap:14px;align-items:flex-start;padding:14px;border:1px solid var(--border);border-radius:13px;margin-bottom:10px;background:#fff}
.thumb{width:70px;height:54px;border-radius:9px;object-fit:cover;flex:none;background:linear-gradient(135deg,#dbeafe,#eff6ff);display:flex;align-items:center;justify-content:center;color:var(--accent);font-size:1.4rem}
.li-body{flex:1;min-width:0}
.li-body .t{font-weight:600}
.li-body .m{color:var(--muted);font-size:.85rem;margin-top:2px;overflow:hidden;text-overflow:ellipsis}
.li-actions{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.badge{font-size:.72rem;font-weight:600;padding:3px 9px;border-radius:99px}
.badge.on{background:#ecfdf5;color:#047857}.badge.off{background:#fef3c7;color:#92400e}
.stars{color:#fbbf24;letter-spacing:1px}
.filters{display:flex;gap:8px;margin-bottom:14px}
.filters .f{padding:7px 13px;border:1px solid var(--border);border-radius:10px;background:#fff;font-size:.85rem;cursor:pointer;color:var(--muted)}
.filters .f.active{background:var(--ink);color:#fff;border-color:var(--ink)}
.empty{text-align:center;color:var(--muted);padding:30px;border:1px dashed var(--border);border-radius:13px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:12px;box-shadow:var(--sh);font-size:.9rem;opacity:0;transition:.3s;pointer-events:none}
.toast.show{opacity:1}
.toast.err{background:#b91c1c}
.row2{display:grid;grid-template-columns:1fr 140px;gap:12px}
@media(max-width:560px){.row2{grid-template-columns:1fr}}
</style>
</head>
<body>
  <div class="topbar"><div class="row">
    <div class="brand">MIRO<b>KON</b> · админка</div>
    <span class="who" id="admin-email"></span>
    <button class="btn btn-ghost" onclick="logout()">Выйти</button>
  </div></div>

  <div class="wrap">
    <div class="tabs">
      <button class="tab active" data-tab="leads" onclick="switchTab('leads')">Заявки</button>
      <button class="tab" data-tab="works" onclick="switchTab('works')">Работы</button>
      <button class="tab" data-tab="reviews" onclick="switchTab('reviews')">Отзывы</button>
      <button class="tab" data-tab="news" onclick="switchTab('news')">Новости</button>
    </div>

    <!-- LEADS -->
    <section class="panel active" id="panel-leads">
      <h2>Заявки</h2>
      <div class="filters">
        <div class="f active" data-lf="new" onclick="setLeadFilter('new')">Новые</div>
        <div class="f" data-lf="processed" onclick="setLeadFilter('processed')">Обработанные</div>
        <div class="f" data-lf="all" onclick="setLeadFilter('all')">Все</div>
      </div>
      <div id="leads-list"></div>
    </section>

    <!-- WORKS -->
    <section class="panel" id="panel-works">
      <div class="card">
        <h3 id="works-form-title">Добавить работу</h3>
        <input type="hidden" id="w-id">
        <div class="row2">
          <div><label>Название *</label><input id="w-title" placeholder="Гостиная на Ленина"></div>
          <div><label>Категория</label><input id="w-category" placeholder="Гостиная"></div>
        </div>
        <label>Описание</label><textarea id="w-desc" placeholder="Двухкамерный стеклопакет…"></textarea>
        <div class="row2">
          <div><label>Фото</label><input type="file" id="w-photo" accept="image/*"></div>
          <div><label>Порядок</label><input type="number" id="w-sort" value="0"></div>
        </div>
        <label class="check"><input type="checkbox" id="w-published"> Опубликовать на сайте</label>
        <div style="margin-top:16px;display:flex;gap:8px">
          <button class="btn btn-primary" id="w-save" onclick="saveWork()">Сохранить</button>
          <button class="btn btn-ghost" onclick="resetWorkForm()">Очистить</button>
        </div>
      </div>
      <h2>Работы</h2>
      <div id="works-list"></div>
    </section>

    <!-- REVIEWS -->
    <section class="panel" id="panel-reviews">
      <h2>Отзывы</h2>
      <div class="filters">
        <div class="f active" data-rf="pending" onclick="setReviewFilter('pending')">На модерации</div>
        <div class="f" data-rf="approved" onclick="setReviewFilter('approved')">Опубликованные</div>
        <div class="f" data-rf="all" onclick="setReviewFilter('all')">Все</div>
      </div>
      <div id="reviews-list"></div>
    </section>

    <!-- NEWS -->
    <section class="panel" id="panel-news">
      <div class="card">
        <h3 id="news-form-title">Добавить новость</h3>
        <input type="hidden" id="n-id">
        <label>Заголовок *</label><input id="n-title" placeholder="Гарантия 5 лет">
        <label>Краткий текст (в карточке)</label><textarea id="n-preview" placeholder="Коротко…"></textarea>
        <label>Полный текст (опционально)</label><textarea id="n-body"></textarea>
        <label class="check"><input type="checkbox" id="n-published"> Опубликовать</label>
        <div style="margin-top:16px;display:flex;gap:8px">
          <button class="btn btn-primary" id="n-save" onclick="saveNews()">Сохранить</button>
          <button class="btn btn-ghost" onclick="resetNewsForm()">Очистить</button>
        </div>
      </div>
      <h2>Новости</h2>
      <div id="news-list"></div>
    </section>
  </div>

  <div class="toast" id="toast"></div>

<script>
  const SUPABASE_URL = 'https://ermeokjqkzpkefqtmvif.supabase.co';
  const SUPABASE_ANON = 'sb_publishable_LhXYeGG0w8wzi7JOlPx5Qg_GXd2Zc0K';
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
  const $ = id => document.getElementById(id);
  const safeUrl = u => (u && /^(https?:\/\/|\/)/i.test(u)) ? u : '';

  function toast(msg, isErr) {
    const t = $('toast'); t.textContent = msg; t.className = 'toast show' + (isErr ? ' err' : '');
    setTimeout(() => { t.className = 'toast'; }, 2600);
  }
  // безопасный конструктор элементов (текст через textContent)
  function el(tag, opts, ...kids) {
    const e = document.createElement(tag); opts = opts || {};
    if (opts.class) e.className = opts.class;
    if (opts.text != null) e.textContent = opts.text;
    if (opts.html === 'svg-win') e.innerHTML = '🪟';
    Object.entries(opts).forEach(([k, v]) => { if (['class','text','html'].includes(k)) return; if (k.startsWith('on')) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v); });
    kids.forEach(k => k && e.appendChild(k));
    return e;
  }

  // ---- Auth guard ----
  (async () => {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) return location.replace('/landing.html');
    const { data: admin, error } = await sb.rpc('is_admin');
    if (error || !admin) { await sb.auth.signOut(); alert('Нет прав администратора'); return location.replace('/landing.html'); }
    $('admin-email').textContent = session.user.email;
    loadLeads(); loadWorks(); loadReviews(); loadNews();
  })();

  async function logout() { await sb.auth.signOut(); location.replace('/landing.html'); }

  function switchTab(name) {
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === name));
    document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.id === 'panel-' + name));
  }

  // ================= LEADS (заявки) =================
  let leadFilter = 'new';
  function setLeadFilter(f) {
    leadFilter = f;
    document.querySelectorAll('.filters .f[data-lf]').forEach(x => x.classList.toggle('active', x.dataset.lf === f));
    loadLeads();
  }
  async function loadLeads() {
    const box = $('leads-list'); box.replaceChildren();
    let q = sb.from('leads').select('*').order('created_at', { ascending: false });
    if (leadFilter === 'new') q = q.eq('processed', false);
    else if (leadFilter === 'processed') q = q.eq('processed', true);
    const { data, error } = await q;
    if (error) return toast('Ошибка загрузки заявок', true);
    if (!data.length) { box.appendChild(el('div', { class: 'empty', text: 'Нет заявок в этой категории' })); return; }
    data.forEach(l => {
      const badge = el('span', { class: 'badge ' + (l.processed ? 'on' : 'off'), text: l.processed ? 'обработана' : 'новая' });
      const phone = el('a', { href: 'tel:' + (l.phone || '').replace(/[^\d+]/g, ''), text: l.phone || '—', style: 'color:var(--primary);text-decoration:none;font-weight:600' });
      const when = new Date(l.created_at).toLocaleString('ru-RU');
      const actions = el('div', { class: 'li-actions' }, badge,
        el('button', { class: l.processed ? 'btn btn-ghost' : 'btn btn-ok', text: l.processed ? 'Вернуть' : 'Обработана',
          onclick: () => moderateLead(l.id, l.processed ? 'unprocess' : 'process') }),
        el('button', { class: 'btn btn-danger', text: 'Удалить', onclick: () => moderateLead(l.id, 'delete') })
      );
      const body = el('div', { class: 'li-body' },
        el('div', { class: 't', text: l.name || '—' }),
        el('div', { class: 'm' }, phone, document.createTextNode(l.message ? '  ·  ' + l.message : '')),
        el('div', { class: 'm', text: when })
      );
      box.appendChild(el('div', { class: 'list-item' }, body, actions));
    });
  }
  async function moderateLead(id, action) {
    if (action === 'delete' && !confirm('Удалить заявку безвозвратно?')) return;
    try {
      const { data: { session } } = await sb.auth.getSession();
      if (!session) return location.replace('/landing.html');
      const res = await fetch('/api/moderate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + session.access_token },
        body: JSON.stringify({ type: 'lead', id, action })
      });
      const d = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(d.error || ('код ' + res.status));
      toast(action === 'delete' ? 'Удалено' : action === 'process' ? 'Обработана' : 'Возвращено в работу');
      loadLeads();
    } catch (e) {
      toast('Ошибка: ' + (e.message || e), true);
    }
  }

  // ================= WORKS =================
  async function loadWorks() {
    const box = $('works-list'); box.replaceChildren();
    const { data, error } = await sb.from('works').select('*').order('sort').order('created_at', { ascending: false });
    if (error) return toast('Ошибка загрузки работ', true);
    if (!data.length) { box.appendChild(el('div', { class: 'empty', text: 'Пока нет работ' })); return; }
    data.forEach(w => {
      const img = safeUrl(w.image_url);
      const thumb = img ? el('img', { class: 'thumb', src: img, alt: '' }) : el('div', { class: 'thumb', text: '🪟' });
      const badge = el('span', { class: 'badge ' + (w.published ? 'on' : 'off'), text: w.published ? 'на сайте' : 'черновик' });
      const actions = el('div', { class: 'li-actions' },
        badge,
        el('button', { class: 'btn btn-ghost', text: w.published ? 'Снять' : 'Опубликовать', onclick: () => togglePublish('works', w.id, !w.published) }),
        el('button', { class: 'btn btn-ghost', text: 'Изменить', onclick: () => editWork(w) }),
        el('button', { class: 'btn btn-danger', text: 'Удалить', onclick: () => del('works', w.id) })
      );
      box.appendChild(el('div', { class: 'list-item' }, thumb,
        el('div', { class: 'li-body' }, el('div', { class: 't', text: w.title }), el('div', { class: 'm', text: [w.category, w.description].filter(Boolean).join(' · ') })),
        actions));
    });
  }
  function editWork(w) {
    $('w-id').value = w.id; $('w-title').value = w.title || ''; $('w-category').value = w.category || '';
    $('w-desc').value = w.description || ''; $('w-sort').value = w.sort || 0; $('w-published').checked = !!w.published;
    $('works-form-title').textContent = 'Изменить работу'; window.scrollTo({ top: 0, behavior: 'smooth' });
  }
  function resetWorkForm() {
    ['w-id','w-title','w-category','w-desc','w-photo'].forEach(i => $(i).value = '');
    $('w-sort').value = 0; $('w-published').checked = false; $('works-form-title').textContent = 'Добавить работу';
  }
  async function saveWork() {
    const title = $('w-title').value.trim();
    if (!title) return toast('Укажите название', true);
    const btn = $('w-save'); btn.disabled = true; btn.textContent = 'Сохранение…';
    try {
      let image_url = null;
      const file = $('w-photo').files[0];
      if (file) {
        const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
        const path = `${crypto.randomUUID()}.${ext}`;
        const up = await sb.storage.from('works').upload(path, file, { cacheControl: '3600', upsert: false });
        if (up.error) throw up.error;
        image_url = sb.storage.from('works').getPublicUrl(path).data.publicUrl;
      }
      const row = { title, category: $('w-category').value.trim() || null, description: $('w-desc').value.trim() || null,
        sort: parseInt($('w-sort').value, 10) || 0, published: $('w-published').checked };
      if (image_url) row.image_url = image_url;
      const id = $('w-id').value;
      const res = id ? await sb.from('works').update(row).eq('id', id) : await sb.from('works').insert(row);
      if (res.error) throw res.error;
      toast('Сохранено'); resetWorkForm(); loadWorks();
    } catch (e) { toast('Ошибка: ' + (e.message || e), true); }
    finally { btn.disabled = false; btn.textContent = 'Сохранить'; }
  }

  // ================= REVIEWS =================
  let reviewFilter = 'pending';
  function setReviewFilter(f) {
    reviewFilter = f;
    document.querySelectorAll('.filters .f[data-rf]').forEach(x => x.classList.toggle('active', x.dataset.rf === f));
    loadReviews();
  }
  async function loadReviews() {
    const box = $('reviews-list'); box.replaceChildren();
    let q = sb.from('reviews').select('*').order('created_at', { ascending: false });
    if (reviewFilter === 'pending') q = q.eq('approved', false);
    else if (reviewFilter === 'approved') q = q.eq('approved', true);
    const { data, error } = await q;
    if (error) return toast('Ошибка загрузки отзывов', true);
    if (!data.length) { box.appendChild(el('div', { class: 'empty', text: 'Нет отзывов в этой категории' })); return; }
    data.forEach(r => {
      const badge = el('span', { class: 'badge ' + (r.approved ? 'on' : 'off'), text: r.approved ? 'опубликован' : 'на модерации' });
      const actions = el('div', { class: 'li-actions' }, badge,
        el('button', { class: r.approved ? 'btn btn-ghost' : 'btn btn-ok', text: r.approved ? 'Снять' : 'Одобрить',
          onclick: () => r.approved ? togglePublish('reviews', r.id, false, 'approved') : moderateReview(r.id, 'approve') }),
        el('button', { class: 'btn btn-danger', text: 'Удалить', onclick: () => moderateReview(r.id, 'reject') })
      );
      box.appendChild(el('div', { class: 'list-item' },
        el('div', { class: 'li-body' },
          el('div', { class: 't' }, el('span', { class: 'stars', text: '★'.repeat(r.rating) }), document.createTextNode('  ' + (r.author_name || '') + (r.author_city ? ' · ' + r.author_city : ''))),
          el('div', { class: 'm', text: r.text })),
        actions));
    });
  }

  // ================= NEWS =================
  async function loadNews() {
    const box = $('news-list'); box.replaceChildren();
    const { data, error } = await sb.from('news').select('*').order('created_at', { ascending: false });
    if (error) return toast('Ошибка загрузки новостей', true);
    if (!data.length) { box.appendChild(el('div', { class: 'empty', text: 'Пока нет новостей' })); return; }
    data.forEach(n => {
      const badge = el('span', { class: 'badge ' + (n.published ? 'on' : 'off'), text: n.published ? 'на сайте' : 'черновик' });
      const actions = el('div', { class: 'li-actions' }, badge,
        el('button', { class: 'btn btn-ghost', text: n.published ? 'Снять' : 'Опубликовать', onclick: () => togglePublish('news', n.id, !n.published) }),
        el('button', { class: 'btn btn-ghost', text: 'Изменить', onclick: () => editNews(n) }),
        el('button', { class: 'btn btn-danger', text: 'Удалить', onclick: () => del('news', n.id) })
      );
      box.appendChild(el('div', { class: 'list-item' },
        el('div', { class: 'li-body' }, el('div', { class: 't', text: n.title }), el('div', { class: 'm', text: n.preview_text || '' })),
        actions));
    });
  }
  function editNews(n) {
    $('n-id').value = n.id; $('n-title').value = n.title || ''; $('n-preview').value = n.preview_text || '';
    $('n-body').value = n.body || ''; $('n-published').checked = !!n.published;
    $('news-form-title').textContent = 'Изменить новость'; window.scrollTo({ top: 0, behavior: 'smooth' });
  }
  function resetNewsForm() {
    ['n-id','n-title','n-preview','n-body'].forEach(i => $(i).value = '');
    $('n-published').checked = false; $('news-form-title').textContent = 'Добавить новость';
  }
  async function saveNews() {
    const title = $('n-title').value.trim();
    if (!title) return toast('Укажите заголовок', true);
    const btn = $('n-save'); btn.disabled = true; btn.textContent = 'Сохранение…';
    try {
      const row = { title, preview_text: $('n-preview').value.trim() || null, body: $('n-body').value.trim() || null, published: $('n-published').checked };
      const id = $('n-id').value;
      const res = id ? await sb.from('news').update(row).eq('id', id) : await sb.from('news').insert(row);
      if (res.error) throw res.error;
      toast('Сохранено'); resetNewsForm(); loadNews();
    } catch (e) { toast('Ошибка: ' + (e.message || e), true); }
    finally { btn.disabled = false; btn.textContent = 'Сохранить'; }
  }

  // ================= общие =================
  async function togglePublish(table, id, value, field) {
    const f = field || 'published';
    const { error } = await sb.from(table).update({ [f]: value }).eq('id', id);
    if (error) return toast('Ошибка: ' + error.message, true);
    toast(value ? 'Опубликовано' : 'Снято с публикации');
    table === 'works' ? loadWorks() : table === 'reviews' ? loadReviews() : loadNews();
  }
  async function del(table, id) {
    if (!confirm('Удалить запись безвозвратно?')) return;
    const { error } = await sb.from(table).delete().eq('id', id);
    if (error) return toast('Ошибка: ' + error.message, true);
    toast('Удалено');
    table === 'works' ? loadWorks() : table === 'reviews' ? loadReviews() : loadNews();
  }

  // Модерация отзыва через сервер: меняет БД И редактирует сообщение в Telegram
  // (убирает кнопки, дописывает «обработано в админке»).
  async function moderateReview(id, action) {
    if (action === 'reject' && !confirm('Удалить отзыв безвозвратно?')) return;
    try {
      const { data: { session } } = await sb.auth.getSession();
      if (!session) return location.replace('/landing.html');
      const res = await fetch('/api/moderate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + session.access_token },
        body: JSON.stringify({ id, action })
      });
      const d = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(d.error || ('код ' + res.status));
      toast(action === 'approve' ? 'Одобрено' : 'Удалено');
      loadReviews();
    } catch (e) {
      toast('Ошибка: ' + (e.message || e), true);
    }
  }
</script>
</body>
</html>
